name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Yarn
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          corepack enable --install-directory "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          yarn --version

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          version: "0.27.0"
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Install Calcit modules
        run: caps --ci --strict

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Verify Calcit toolchain
        run: caps verify --toolchain

      - name: Validate Snapshot and types
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit analyze check-public --ns 'app.$meta' --ns app.main
          calcit calcit.cirru analyze deprecated --summary-only --format json

      - name: Run Calcit tests
        run: calcit calcit.cirru test --require-match

      - name: Compile and run JavaScript target
        run: |
          yarn build
          node main.mjs
          git diff --exit-code -- data/target.cirru
