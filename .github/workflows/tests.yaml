name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Yarn
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          corepack enable --install-directory "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          yarn --version

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          deps-file: deps.cirru
          tools: calcit,caps
          caps-version: "0.1.1"

      - name: Install Calcit modules
        run: caps --ci --strict

      - name: Install JavaScript dependencies
        run: yarn install --immutable

      - name: Verify Calcit toolchain
        run: caps verify --toolchain

      - name: Validate Snapshot and types
        run: |
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only --all-defs
          calcit calcit.cirru fix --workflow strict --verify --format json

      - name: Run Calcit tests
        run: calcit calcit.cirru test --require-match

      - name: Compile and run JavaScript target
        run: |
          set -euo pipefail
          yarn build
          node main.mjs
          git diff --exit-code -- data/target.cirru
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { mkdtempSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';
          import { parse_cirru_edn, to_calcit_data, _$n__$e_ } from '@calcit/procs';
          const fixture = mkdtempSync(join(tmpdir(), 'convert-edn-'));
          mkdirSync(join(fixture, 'data'));
          writeFileSync(join(fixture, 'data/source.edn'),
            '{:nested {:items [1 true nil "031 转换 🐈"]} :empty ()}');
          execFileSync(process.execPath, [resolve('main.mjs')], { cwd: fixture, stdio: 'inherit' });
          const actual = parse_cirru_edn(readFileSync(join(fixture, 'data/target.cirru'), 'utf8'));
          const expected = to_calcit_data({ ':nested': { ':items': [1, true, null, '031 转换 🐈'] }, ':empty': [] });
          assert.ok(_$n__$e_(actual, expected), 'nested/empty/nil/Unicode file conversion');
          console.log('Isolated file conversion passed');
          NODE
